[package]
name = "lumetrope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lumetrope engine: Lottie model, renderer, state machines, ops, VCS"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tiny-skia = "0.11"
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
ttf-parser = { version = "0.24", default-features = false, features = ["std", "opentype-layout", "variable-fonts", "glyph-names"] }
usvg = { version = "0.45", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = { version = "0.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gif = { version = "0.13", default-features = false, features = ["color_quant", "std"] }
image-webp = "0.2"
