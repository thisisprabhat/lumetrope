[package]
name = "lumetrope-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Lumetrope engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumetrope-core = { path = "../core" }
wasm-bindgen = "0.2"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
