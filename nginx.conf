server {
    listen 6001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Support wasm mime type and brotli/gzip compression
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|wasm|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
